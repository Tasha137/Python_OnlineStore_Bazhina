<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 24px;
      text-align: center;
      color: #222;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #4a74ff;
    }

    .errors {
      margin-bottom: 16px;
      color: #b00020;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      background: #4a74ff;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover {
      background: #365ce0;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h2>Вход в личный кабинет</h2>

      <form method="post">
        {% csrf_token %}

        {% if form.non_field_errors %}
          <div class="errors">
            {{ form.non_field_errors }}
          </div>
        {% endif %}

        <div class="form-group">
          <label for="{{ form.username.id_for_label }}">Логин</label>
          {{ form.username }}
          {{ form.username.errors }}
        </div>

        <div class="form-group">
          <label for="{{ form.password.id_for_label }}">Пароль</label>
          {{ form.password }}
          {{ form.password.errors }}
        </div>

        <button type="submit" class="btn">Войти</button>
      </form>
    </div>
  </div>
</body>
</html>
